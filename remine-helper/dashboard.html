<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RESCENE Dashboard</title>
  <link rel="icon" href="icons/rescene-logo.png" type="image/x-icon">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- 실시간 라이브 감지 배너 마운트 -->
  <div id="liveBannerMount"></div>

  <div class="dashboard-container" id="dashboardMainGrid">

    <!-- 좌측 컬럼: 탭 네비게이션 + 캘린더 / 임베드 뷰 -->
    <div class="dashboard-col left-col">
      <div class="glass-card dashboard-main-card" id="mainContentCard">
        
        <!-- 상단 헤더: 탭바 + 컨트롤 버튼 -->
        <div class="dashboard-main-header">
          <div class="header-controls">
            <button class="theme-toggle-btn" id="themeToggleBtn">🌓 테마</button>
            <button class="maximize-btn" id="maximizeCalendarBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:2px;"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>최대화</button>
          </div>
          <!-- 동적 탭 네비게이션 바 마운트 -->
          <div id="tabBarMount"></div>
        </div>

        <!-- 탭 컨텐츠 컨테이너 마운트 -->
        <div id="tabContainersMount" class="dashboard-tab-mount"></div>

      </div>
    </div>

    <!-- 우측 컬럼: 공식 채널 허브 + 유튜브 그리드 + 팬페이지 링크 + 푸터 마운트 -->
    <div class="dashboard-col right-col" id="dashboardRightColMount"></div>

  </div>

  <!-- 스케줄 상세 모달 및 툴팁 마운트 -->
  <div id="modalMount"></div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
