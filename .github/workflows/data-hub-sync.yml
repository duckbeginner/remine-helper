name: Central Data Hub Sync

on:
  schedule:
    # 15분마다 자동 실행 (UTC 기준)
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'scripts/data-hub/**'
      - '.github/workflows/data-hub-sync.yml'
  workflow_dispatch: # GitHub UI에서 수동 트리거 가능

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Data Hub Aggregator
        run: node scripts/data-hub/fetch-all.js

      - name: Run Schema Validation Test
        run: node scripts/data-hub/validate.js

      - name: Upload data.json to GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "44b49b328233ef6157499debe03f165c"
        run: node scripts/data-hub/upload-gist.js
