name: Central Data Hub Daily Full Snapshot

concurrency:
  group: data-hub-pipeline
  cancel-in-progress: false

on:
  schedule:
    # 매일 UTC 19:10 (한국시간 새벽 04:10) 1회 자동 실행 (15분 주기 sync와 동시 실행 방지 오프셋)
    - cron: '10 19 * * *'
  workflow_dispatch:

jobs:
  daily-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore Data Hub Cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: data-hub-daily-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            data-hub-daily-cache-${{ runner.os }}-
            data-hub-cache-

      - name: Run Full Data Hub Aggregator (--full)
        run: node scripts/data-hub/fetch-all.js --full

      - name: Run Schema Validation Test
        run: node scripts/data-hub/validate.js

      - name: Upload 2-Tier Data to GitHub Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: "44b49b328233ef6157499debe03f165c"
        run: node scripts/data-hub/upload-gist.js

      - name: Commit & Push Daily Master Snapshot to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/v1/*.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data-hub): daily snapshot full master archive [skip ci]"
            # Rebase 후 푸시 및 동시성 충돌 방지 재시도 (최대 3회, 실패 시 명시적 exit 1)
            PUSH_SUCCESS=false
            for i in {1..3}; do
              if git pull --rebase origin main && git push; then
                PUSH_SUCCESS=true
                break
              fi
              echo "⚠️ Git push 재시도 $i/3 실패, 3초 후 재시도..."
              sleep 3
            done
            if [ "$PUSH_SUCCESS" != "true" ]; then
              echo "❌ Git push 3회 재시도 모두 실패!"
              exit 1
            fi
          else
            echo "⚡ 변경된 데이터가 없어 Git 커밋을 스킵합니다."
          fi

