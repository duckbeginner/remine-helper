<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>RESCENE Dashboard</title>
  <link rel="icon" href="icons/rescene-logo.png" type="image/x-icon">
  <script src="common/theme-preload.js"></script>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <!-- 실시간 라이브 감지 배너 마운트 -->
  <div id="liveBannerMount"></div>

  <div class="dashboard-container" id="dashboardMainGrid">

    <!-- 좌측 컬럼: 탭 네비게이션 + 캘린더 / 임베드 뷰 -->
    <div class="dashboard-col left-col">
      <div class="glass-card dashboard-main-card" id="mainContentCard">
        
        <!-- 상단 헤더: 탭바 + 컨트롤 버튼 -->
        <div class="dashboard-main-header">
          <div class="header-controls">
            <button class="theme-toggle-btn" id="themeToggleBtn" title="테마 전환">
              <span class="vtab-icon-svg" id="themeIconHolder">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"></path>
                </svg>
              </span>
              <span class="vtab-btn-label">테마</span>
            </button>
            <button class="theme-toggle-btn" id="openSettingsBtn" title="사용자 설정">
              <span class="vtab-icon-svg">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </span>
              <span class="vtab-btn-label">설정</span>
            </button>
            <button class="maximize-btn" id="maximizeCalendarBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px; margin-right:2px;"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>최대화</button>
          </div>
          <!-- 동적 탭 네비게이션 바 마운트 -->
          <div id="tabBarMount"></div>
        </div>

        <!-- 탭 컨텐츠 컨테이너 마운트 -->
        <div id="tabContainersMount" class="dashboard-tab-mount"></div>

      </div>
    </div>

    <!-- 우측 컬럼: 공식 채널 허브 + 유튜브 그리드 + 팬페이지 링크 + 푸터 마운트 -->
    <div class="dashboard-col right-col" id="dashboardRightColMount"></div>

  </div>

  <!-- 스케줄 상세 모달 및 툴팁 마운트 -->
  <div id="modalMount"></div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
