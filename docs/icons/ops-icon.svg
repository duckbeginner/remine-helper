<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 다크 그라디언트 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#181c28" />
      <stop offset="100%" stop-color="#0b0d13" />
    </radialGradient>
    <!-- 브랜드 심볼 그라디언트 -->
    <linearGradient id="rmBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007a" />
      <stop offset="100%" stop-color="#ff75c3" />
    </linearGradient>
    <!-- OPS 뱃지 그라디언트 -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <!-- 드롭 섀도우 -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="symbolShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff007a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 베이스 배경 (iOS 홈 화면용 솔리드 다크) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- 중앙 Remine Helper 공식 심볼 (중앙보다 약간 위쪽 배치로 뱃지와 조화) -->
  <g transform="translate(64, 48) scale(2.85)" filter="url(#symbolShadow)">
    <g fill="url(#rmBrandGrad)">
      
    <path fill-rule="evenodd" d="M 13.5 15 L 51.5 15 Q 60.37 17.13 65 23.5 L 67 28.5 L 67 34.5 L 66 38.5 L 62 44.5 Q 69.28 46.72 73 52.5 L 82.5 69 L 99 38.5 L 106.5 30 L 115 29 Q 116.25 32 112.5 31 L 110 34.5 L 110 89.5 L 114 92.5 L 111.5 94 L 95 94 Q 93.75 91 97.5 92 L 100 88.5 L 100 45.5 L 99 45.5 L 85 72.5 L 85 77.5 L 88.5 82 L 91 83.5 L 85.5 84 Q 80.13 82.88 78 78.5 L 65 54 L 63 54.5 L 63 69.5 L 62 69.5 L 60 65.5 L 60 49.5 L 58.5 48 L 44 52.5 L 49.5 55 L 56 61.5 Q 62.34 76.66 73.5 87 L 87.5 95 L 99.5 98 L 104.5 98 L 114.5 95 L 121.5 89 L 122 91.5 L 115.5 99 L 105.5 103 L 90.5 103 Q 74.6 99.4 64.5 90 L 61.5 94 Q 57.95 97.17 51 96 Q 49.75 93 53.5 94 L 59 89.5 L 60 84.5 L 55 78.5 L 46 61.5 L 41.5 57 Q 39.5 54.5 34.5 55 L 29 59.5 L 28 62.5 L 28 77.5 L 31.5 82 L 35 83.5 L 13 84 Q 11.75 81 15.5 82 L 19 77.5 L 19 20.5 L 16.5 17 Q 12.75 16.75 13.5 15 Z M 34 17 L 31 18 L 28 23 L 28 54 L 35 51 L 46 49 L 52 46 Q 56 43 58 37 Q 59 28 56 25 L 48 18 L 34 17 Z" />
    <path d="M 41.5 28 Q 41.83 32.67 45.5 34 L 48 34.5 L 42 39.5 L 41.5 42 Q 41.17 37.33 37.5 36 L 35 34.5 Q 39.67 34.17 41 30.5 L 41.5 28 Z" />
    <path d="M 65.5 97 Q 66.38 102.62 70.5 105 L 73 105.5 L 67 109.5 L 65.5 114 Q 64.87 109.13 61.5 107 L 58 105.5 Q 62.67 105.17 64 101.5 L 65.5 97 Z" />
  
    </g>
  </g>

  <!-- 우측 하단 OPS 태그 뱃지 (iOS 모서리 곡률 안전 마진 적용: 우측/하단 32px 안전 여백) -->
  <g transform="translate(284, 356)" filter="url(#badgeShadow)">
    <!-- 뱃지 외곽 테두리 및 배경 캡슐 -->
    <rect x="0" y="0" width="180" height="96" rx="30" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
    <!-- 내부 음영/글래스 하이라이트 라인 -->
    <rect x="3" y="3" width="174" height="42" rx="27" fill="rgba(255, 255, 255, 0.18)" />
    <!-- OPS 텍스트 -->
    <text x="90" y="65" font-family="-apple-system, BlinkMacSystemFont, Pretendard, Inter, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">OPS</text>
  </g>
</svg>